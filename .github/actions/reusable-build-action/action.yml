# .github/actions/reusable-build-action/action.yml
name: "Build and Test PostgreSQL Version"

description: "Builds and tests the pglinter extension for a given PostgreSQL version."

inputs:
  pgver:
    description: "The PostgreSQL major version with the \"pg\" prefix (e.g. `pg15`,
      `pg16`, etc.)"
    required: true
  always:
    description: "Run lint in addition to the build and tests."
    required: false

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bison build-essential clang flex libclang-dev \
          libicu-dev libreadline-dev libssl-dev pkg-config zlib1g-dev

    - name: Set up Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable

    - name: Set up pgrx and PostgreSQL
      shell: bash
      env:
        PGVER: ${{ inputs.pgver }}
      run: |
        pgrx_version="$(sed -nE 's/^pgrx = "([^"]+)"/\1/p' Cargo.toml)"
        if [ -z "$pgrx_version" ]; then
          echo "Could not determine pgrx version from Cargo.toml"
          exit 1
        fi

        cargo install --locked --version "$pgrx_version" cargo-pgrx
        cargo pgrx init "--$PGVER" download

    - name: Lint (only for default PG version)
      if: inputs.always != ''
      run: make lint
      shell: bash

    - name: Build the extension package
      env:
        PGVER: ${{ inputs.pgver }}
      run: make PGVER="$PGVER"
      shell: bash

    - name: Launch postgres instance and run unit tests
      env:
        PGVER: ${{ inputs.pgver }}
      run: make PGVER="$PGVER" test
      shell: bash

    - name: Run regression tests
      env:
        PGVER: ${{ inputs.pgver }}
      run: |
        make PGVER="$PGVER" install
        make PGVER="$PGVER" installcheck
      shell: bash

name: "Build and Test pglinter"

on:
  pull_request:
    branches:
      - main # Optional: specify branches for the pull request to merge into
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README.md"
      - "mkdocs.yml"
  workflow_dispatch:
    inputs:
      pgversions:
        description: "PostgreSQL versions to build (comma-separated: pg18)"
        required: false
        default: "pg18"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ##
  ## B U I L D / T E S T
  ##
  build:
    strategy:
      matrix:
        pgver: [pg15, pg16, pg17, pg18, pg19]
      fail-fast: false
    name: "build-and-tests-pglinter-for-${{ matrix.pgver }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Call reusable build action
        uses: ./.github/actions/reusable-build-action
        with:
          pgver: ${{ matrix.pgver }}
          always: ${{ matrix.pgver == 'pg15' && 'yes' || '' }}

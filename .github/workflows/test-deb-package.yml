# .github/workflows/test-single-pg.yml
name: Test DEB Package

on:
  workflow_dispatch:
    inputs:
      pg_version:
        description: "PostgreSQL version to test"
        required: true
        default: "17"
        type: choice
        options: ["14", "15", "16", "17", "18"]
      platform:
        description: "Target platform"
        required: false
        default: "linux/amd64"
        type: choice
        options: ["linux/amd64", "linux/arm64"]
      pglinter_version:
        description: "pglinter version to test"
        required: false
        default: "0.0.19"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-deb-amd64-pglinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test deb package
        uses: ./.github/actions/reusable-test-deb-package
        with:
          pg_version: ${{ inputs.pg_version }}
          pglinter_version: ${{ inputs.pglinter_version }}
          platform: ${{ inputs.platform }}
          timeout: "180"

  test-deb-arm64-pglinter:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test deb package
        uses: ./.github/actions/reusable-test-deb-package
        with:
          pg_version: ${{ inputs.pg_version }}
          pglinter_version: ${{ inputs.pglinter_version }}
          platform: ${{ inputs.platform }}
          timeout: "180"

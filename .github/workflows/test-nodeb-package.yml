name: Test NODEB Package

on:
  workflow_dispatch:
    inputs:
      pg_version:
        description: "PostgreSQL version to test"
        required: true
        default: "17"
        type: choice
        options: ["14", "15", "16", "17", "18"]
      pglinter_version:
        description: "pglinter version"
        required: true
        default: "0.0.19"
      platform:
        description: "Target platform"
        required: false
        default: "linux/amd64"
      timeout:
        description: "Container timeout (seconds)"
        required: false
        default: "120"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-nodeb-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test PostgreSQL NODEB image
        uses: ./.github/actions/reusable-test-nodeb-package
        with:
          pg_version: ${{ inputs.pg_version }}
          pglinter_version: ${{ inputs.pglinter_version }}
          platform: ${{ inputs.platform }}
          timeout: ${{ inputs.timeout }}
